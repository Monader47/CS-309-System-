<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header / Navigation -->
    <header>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
            </ul>
        </nav>
    </header>

    <!-- Main Content -->
    <main>
        <section class="contact-section">
            <h1>Get in Touch</h1>
            <p>We would love to hear from you. Please fill out the form below:</p>

            <form action="#" method="POST" class="contact-form">
                
                <!-- 1. Text Field -->
                <div class="form-group">
                    <label for="fullname">Full Name:</label>
                    <input type="text" id="fullname" name="fullname" required placeholder="Enter your full name">
                </div>

                <!-- 2. Email Field -->
                <div class="form-group">
                    <label for="email">Email Address:</label>
                    <input type="email" id="email" name="email" required placeholder="name@example.com">
                </div>

                <!-- 3. Number Field -->
                <div class="form-group">
                    <label for="phone">Phone Number:</label>
                    <input type="number" id="phone" name="phone" placeholder="Enter your phone number">
                </div>

                <!-- 4. Date Field -->
                <div class="form-group">
                    <label for="preferred-date">Preferred Date:</label>
                    <input type="date" id="preferred-date" name="preferred_date">
                </div>

                <!-- 5. Radio Buttons -->
                <div class="form-group">
                    <label>Preferred Contact Method:</label>
                    <div class="radio-group">
                        <label><input type="radio" name="contact_method" value="email" checked> Email</label>
                        <label><input type="radio" name="contact_method" value="phone"> Phone</label>
                    </div>
                </div>

                <!-- 6. Checkboxes -->
                <div class="form-group">
                    <label>Areas of Interest:</label>
                    <div class="checkbox-group">
                        <label><input type="checkbox" name="interests" value="web"> Web Development</label>
                        <label><input type="checkbox" name="interests" value="database"> Database Design</label>
                        <label><input type="checkbox" name="interests" value="other"> Other</label>
                    </div>
                </div>

                <!-- 7. Dropdown Menu (Select) -->
                <div class="form-group">
                    <label for="subject">Subject:</label>
                    <select id="subject" name="subject">
                        <option value="general">General Inquiry</option>
                        <option value="support">Technical Support</option>
                        <option value="feedback">Feedback</option>
                    </select>
                </div>

                <!-- 8. Large Text Box (Textarea) -->
                <div class="form-group">
                    <label for="message">Your Message:</label>
                    <textarea id="message" name="message" rows="5" placeholder="Write your message here..."></textarea>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="submit-btn">Send Message</button>

            </form>
        </section>
    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Your Website. All rights reserved.</p>
    </footer>

</body>
</html>
